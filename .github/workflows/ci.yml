name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Parses on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin header promises "Requires PHP: 8.0", so the shipped code has
        # to parse there. The test tooling does not run on 8.0 (PHPUnit 10 needs
        # 8.1), which is why parsing and testing are separate jobs rather than one
        # matrix that would quietly drop the oldest version.
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every shipped PHP file
        run: |
          set -e
          # Only the files that actually ship: tests are dev-only and may use
          # newer syntax than the plugin promises.
          find . -path ./vendor -prune -o -path ./tests -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 php -l

  unit:
    name: PHPUnit on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dev dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: PHPUnit
        run: vendor/bin/phpunit --testdox

  package:
    name: ZIP stays clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The plugin ships without Composer. This builds the archive the same way
      # a release does (git archive honours .gitattributes export-ignore) and
      # looks INSIDE it — checking that a filename appears in an ignore list
      # would prove nothing about what actually ships.
      - name: Build the shippable tree and inspect it
        run: |
          set -e
          git archive HEAD --prefix=alphabridge-mcp/ -o /tmp/plugin.tar
          echo "--- files that would ship ---"
          tar -tf /tmp/plugin.tar
          echo "--- forbidden entries ---"
          if tar -tf /tmp/plugin.tar | grep -E 'composer\.(json|lock)|phpunit|/tests/|/vendor/|/\.github/|\.gitattributes|\.distignore'; then
            echo "FAIL: development files would reach the plugin directory"
            exit 1
          fi
          echo "none"
          # The two files WordPress.org needs must be there.
          for required in alphabridge-mcp/alphabridge-mcp.php alphabridge-mcp/readme.txt; do
            tar -tf /tmp/plugin.tar | grep -qx "$required" || { echo "FAIL: $required missing"; exit 1; }
          done
          echo "readme.txt and the plugin file are present"
          # The bundled translations ship since 4.4.0. An export-ignore on
          # languages/ would leave the tests in the checkout green and still
          # strip them from every release, so each tracked file must be inside.
          for f in $(git ls-files languages); do
            tar -tf /tmp/plugin.tar | grep -qx "alphabridge-mcp/$f" || { echo "FAIL: $f missing from the archive"; exit 1; }
          done
          echo "all $(git ls-files languages | wc -l | tr -d ' ') translation files are in the archive"

      # readme.txt is what WordPress.org serves from. Its Stable tag decides
      # which version users get, so it must never quietly drift ahead of a
      # version that was never released — nor lag behind one that was.
      - name: Stable tag is not ahead of the plugin version
        run: |
          set -e
          stable=$(grep -m1 -oE '^Stable tag: *[0-9.]+' readme.txt | grep -oE '[0-9.]+')
          version=$(grep -m1 -oE '^ \* Version: +[0-9.]+' alphabridge-mcp.php | grep -oE '[0-9.]+')
          echo "Stable tag=$stable  plugin version=$version"
          if [ "$(printf '%s\n%s\n' "$stable" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "FAIL: Stable tag $stable is ahead of the plugin version $version"
            exit 1
          fi
          [ "$stable" = "$version" ] || echo "NOTE: release pending — bump Stable tag to $version when publishing (see RELEASE.md)"

      - name: Plugin header version matches the constant
        run: |
          set -e
          header=$(grep -m1 -oE '^ \* Version: +[0-9.]+' alphabridge-mcp.php | grep -oE '[0-9.]+')
          const=$(grep -m1 -oE "AB_MCP_VERSION', '[0-9.]+" alphabridge-mcp.php | grep -oE '[0-9.]+')
          echo "header=$header constant=$const"
          [ "$header" = "$const" ]

  js:
    name: The settings page's JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The choice of assistant and where an address lands, run with the
      # real assets/admin.js in an in-memory stand-in for the DOM; no
      # dependencies, Node as the runner ships it.
      - name: Panels, remembered choice, landing on a block
        run: node tests/admin-js-test.mjs

  # The integration suite (Z8, Entscheid 34): two WordPress 7.1.3 sites on
  # MariaDB under two table prefixes, each served by `php -S` and running the
  # plugin of this checkout. tests/integration/README.md has the same on a Mac.
  integration:
    name: Two WordPress 7.1.3 sites on MariaDB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: ab_it
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      AB_IT_WP_CORE: ${{ github.workspace }}/wp-core
      AB_IT_DB_HOST: 127.0.0.1:3306
      AB_IT_DB_USER: root
      AB_IT_DB_PASSWORD: ''
      AB_IT_DB_NAME: ab_it
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      # WordPress 7.1.3 from its official Git mirror, pinned by the commit of
      # the tag; its tree and a SHA-256 over every file are checked before
      # anything runs on it. The same digest of ~/Entwicklung/wp-core-7.1.3
      # is what the Mac runs (tests/integration/README.md).
      - uses: actions/checkout@v4
        with:
          repository: WordPress/WordPress
          ref: fc9832bef919c2a08541248db23af90d14ffb082
          path: wp-core
          persist-credentials: false

      - name: WordPress is exactly 7.1.3
        working-directory: wp-core
        run: |
          set -e
          test "$(git rev-parse 'HEAD^{tree}')" = 3cf9bd1d4c80377392a4f3431921683d2633d24c
          sum=$(find . -type f -not -path './.git/*' -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)
          echo "SHA-256 over the files: $sum"
          test "$sum" = dbe227baf6382418efdc7c2f5587d2341ab12ffea5a027afc383522f674a8ffc
          grep -q "^\$wp_version = '7.1.3';" wp-includes/version.php

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, curl, sodium
          coverage: none
          tools: composer:v2

      - name: Install dev dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Set up and serve the two sites
        run: |
          set -e
          echo "AB_IT_ROOT=$RUNNER_TEMP/ab-it" >> "$GITHUB_ENV"
          export AB_IT_ROOT="$RUNNER_TEMP/ab-it"
          php tests/integration/bin/setup.php
          bash tests/integration/bin/serve.sh start

      - name: Integration suite
        run: vendor/bin/phpunit -c tests/integration/phpunit.xml.dist --testdox

      - name: Logs of the sites
        if: failure()
        run: tail -n 200 "$AB_IT_ROOT"/log/* || true

  # Mutation probes, clause by clause (tests/mutation/run.php): each entry of
  # tests/mutation/lists/ takes one clause out and expects its tests to fail;
  # the file is written back and compared byte for byte. The lists of the
  # heikel/ branches ask the integration suite, so the sites run here too.
  mutation:
    name: Every listed clause is held by a test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: ab_it
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      AB_IT_WP_CORE: ${{ github.workspace }}/wp-core
      AB_IT_DB_HOST: 127.0.0.1:3306
      AB_IT_DB_USER: root
      AB_IT_DB_PASSWORD: ''
      AB_IT_DB_NAME: ab_it
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: actions/checkout@v4
        with:
          repository: WordPress/WordPress
          ref: fc9832bef919c2a08541248db23af90d14ffb082
          path: wp-core
          persist-credentials: false

      - name: WordPress is exactly 7.1.3
        working-directory: wp-core
        run: |
          set -e
          test "$(git rev-parse 'HEAD^{tree}')" = 3cf9bd1d4c80377392a4f3431921683d2633d24c
          sum=$(find . -type f -not -path './.git/*' -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)
          test "$sum" = dbe227baf6382418efdc7c2f5587d2341ab12ffea5a027afc383522f674a8ffc

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, curl, sodium, pcntl
          coverage: none
          tools: composer:v2

      - name: Install dev dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Set up and serve the two sites
        run: |
          set -e
          echo "AB_IT_ROOT=$RUNNER_TEMP/ab-it" >> "$GITHUB_ENV"
          export AB_IT_ROOT="$RUNNER_TEMP/ab-it"
          php tests/integration/bin/setup.php
          bash tests/integration/bin/serve.sh start

      - name: Mutation probes
        run: php tests/mutation/run.php

      - name: The checkout is unchanged
        if: always()
        run: |
          set -e
          git status --porcelain
          test -z "$(git status --porcelain)"
